{% load static %}

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일정 조회</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/index_style.css' %}">
</head>
<body>

    <div style="position:relative;">
        <div class="dot-top"></div>
        <div class="dot-bottom"></div>

        <div class="card">
            <!-- 헤더 -->
            <div class="card-header">
                <div class="badge">✦ Schedule Viewer</div>
                <h1>일정 조회</h1>
                <p>조회하실 기간을 선택해 주세요</p>
            </div>

            <!-- 바디 -->
            <div class="card-body">
                <form action="{% url 'inuwasischedule:view_schedule' %}" method="GET">

                    <div class="form-group">
                        <label for="start_date">시작일</label>
                        <input type="date" id="start_date" name="start" required>
                    </div>

                    <div class="divider">
                        <div class="divider-dot">↓</div>
                    </div>

                    <div class="form-group">
                        <label for="end_date">종료일</label>
                        <input type="date" id="end_date" name="end" required>
                    </div>

                    <button type="submit">🔍 &nbsp;조회하기</button>
                </form>

                <p class="footer-note">날짜를 선택하면 해당 기간의 일정을 확인할 수 있어요 ✨</p>
            </div>
        </div>
    </div>

</body>
</html>
